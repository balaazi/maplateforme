<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle moderne -->
  <circle cx="20" cy="20" r="18" fill="url(#grad2)"/>
  
  <!-- Réseau de connexions -->
  <g fill="white" stroke="white">
    <!-- Nœud central -->
    <circle cx="20" cy="20" r="3" fill="white"/>
    
    <!-- Nœuds périphériques -->
    <circle cx="12" cy="12" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="28" cy="12" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="12" cy="28" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="28" cy="28" r="2.5" fill="white" opacity="0.8"/>
    
    <!-- Lignes de connexion -->
    <line x1="14.5" y1="14.5" x2="17" y2="17" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="25.5" y1="14.5" x2="23" y2="17" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="14.5" y1="25.5" x2="17" y2="23" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="25.5" y1="25.5" x2="23" y2="23" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
</svg> 