<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Losange tournée -->
  <rect x="8" y="8" width="24" height="24" rx="4" ry="4" fill="url(#grad4)" transform="rotate(45 20 20)"/>
  
  <!-- Icône simple -->
  <g fill="white">
    <!-- Croix moderne représentant les connexions -->
    <rect x="18" y="12" width="4" height="16" rx="2"/>
    <rect x="12" y="18" width="16" height="4" rx="2"/>
    
    <!-- Points aux extrémités -->
    <circle cx="20" cy="10" r="2" opacity="0.8"/>
    <circle cx="20" cy="30" r="2" opacity="0.8"/>
    <circle cx="10" cy="20" r="2" opacity="0.8"/>
    <circle cx="30" cy="20" r="2" opacity="0.8"/>
  </g>
</svg> 