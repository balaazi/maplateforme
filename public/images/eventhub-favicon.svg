<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle moderne -->
  <circle cx="16" cy="16" r="14" fill="url(#grad)"/>
  
  <!-- Réseau de connexions -->
  <g fill="white" stroke="white">
    <!-- Nœud central -->
    <circle cx="16" cy="16" r="2.5" fill="white"/>
    
    <!-- Nœuds périphériques -->
    <circle cx="9" cy="9" r="2" fill="white" opacity="0.8"/>
    <circle cx="23" cy="9" r="2" fill="white" opacity="0.8"/>
    <circle cx="9" cy="23" r="2" fill="white" opacity="0.8"/>
    <circle cx="23" cy="23" r="2" fill="white" opacity="0.8"/>
    
    <!-- Lignes de connexion -->
    <line x1="11" y1="11" x2="13.5" y2="13.5" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="21" y1="11" x2="18.5" y2="13.5" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="11" y1="21" x2="13.5" y2="18.5" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="21" y1="21" x2="18.5" y2="18.5" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>