<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Cercle principal de l'icône -->
  <circle cx="40" cy="40" r="35" fill="url(#iconGradient)" />
  
  <!-- Hub central -->
  <circle cx="40" cy="40" r="8" fill="url(#accentGradient)" />
  
  <!-- Points connectés représentant les participants/événements -->
  <circle cx="20" cy="20" r="5" fill="url(#accentGradient)" opacity="0.8" />
  <circle cx="60" cy="20" r="5" fill="url(#accentGradient)" opacity="0.8" />
  <circle cx="20" cy="60" r="5" fill="url(#accentGradient)" opacity="0.8" />
  <circle cx="60" cy="60" r="5" fill="url(#accentGradient)" opacity="0.8" />
  
  <!-- Lignes de connexion -->
  <line x1="25" y1="25" x2="32" y2="32" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7" />
  <line x1="55" y1="25" x2="48" y2="32" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7" />
  <line x1="25" y1="55" x2="32" y2="48" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7" />
  <line x1="55" y1="55" x2="48" y2="48" stroke="url(#accentGradient)" stroke-width="3" opacity="0.7" />
  
  <!-- Effet de brillance -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  
  <!-- Texte EventHub -->
  <text x="90" y="35" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="url(#textGradient)">Event</text>
  <text x="90" y="55" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="url(#textGradient)">Hub</text>
</svg> 