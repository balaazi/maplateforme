<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="modernGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Carré arrondi moderne -->
  <rect x="4" y="4" width="32" height="32" rx="8" ry="8" fill="url(#modernGrad)"/>
  
  <!-- Icône événements minimaliste -->
  <g fill="white">
    <!-- Trois rectangles représentant des événements empilés -->
    <rect x="10" y="10" width="20" height="4" rx="2" opacity="0.9"/>
    <rect x="10" y="16" width="20" height="4" rx="2" opacity="0.7"/>
    <rect x="10" y="22" width="20" height="4" rx="2" opacity="0.9"/>
    
    <!-- Point central Hub -->
    <circle cx="20" cy="30" r="2" opacity="0.8"/>
  </g>
  
  <!-- Ligne de connexion subtile -->
  <line x1="20" y1="26" x2="20" y2="28" stroke="white" stroke-width="1" opacity="0.6"/>
</svg> 