# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    photos_directory: '%kernel.project_dir%/public/uploads/photos'
    documents_directory: '%kernel.project_dir%/public/uploads/documents'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Services publics pour les tests
    App\Service\EmailService:
        public: true

    App\Service\NotificationService:
        public: true

    App\Service\ReminderService:
        public: true

    App\Service\RealtimeNotificationService:
        public: true

    App\Controller\Api\ReminderApiController:
        public: true

    App\Security\AppAuthenticator:
        arguments:
            $router: '@router.default'
            $userRepository: '@App\Repository\UserRepository'

    App\Controller\UserController:
        tags: ['controller.service_arguments']

    App\Service\EventNotificationService:
        arguments:
            $mailer: '@mailer.mailer'
            $userRepository: '@App\Repository\UserRepository'

    App\Service\AdminNotificationService:
        arguments:
            $mailer: '@mailer.mailer'

    App\Service\FileUploadService:
        arguments:
            $documentsDirectory: '%documents_directory%'

    App\Service\GoogleCalendarService:
        arguments:
            $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
            $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
            $googleRedirectUri: '%env(GOOGLE_REDIRECT_URI)%'
            $projectDir: '%kernel.project_dir%'

    # Event listener pour capturer les erreurs d'accès
    App\EventListener\AccessDeniedListener:
        tags:
            - { name: kernel.event_subscriber }

    # Event listener pour l'expiration automatique des invitations
    App\EventListener\InvitationExpirationListener:
        tags:
            - { name: kernel.event_subscriber }

    # Event listener simple pour l'expiration automatique
    App\EventListener\AutoExpirationListener:
        tags:
            - { name: kernel.event_subscriber }